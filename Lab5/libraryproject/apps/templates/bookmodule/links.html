
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Links</title>
    <link rel="stylesheet" href="{% static 'main.css' %}">
</head>
<body>

    <div id="links-container">

        <a class="link-box link-one"
           href="https://www.qu.edu.sa/"
           target="_blank"
           rel="noopener noreferrer">
            Go to QU website (open a new tab)
        </a>

        <a class="link-box link-two"
           href="https://www.qu.edu.sa/"
           target="_self">
            Go to QU website (open in the same page/tab)
        </a>

        <a class="link-box link-three"
           href="https://www.qu.edu.sa/">
            Go to QU website (open in the same page/tab)
        </a>

    </div>

</body>
</html>
